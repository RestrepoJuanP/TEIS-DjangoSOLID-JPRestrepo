upstream django_backend {
    server web:8000;
}

server {
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Nginx sirve los estáticos directamente, sin molestar a Python
    location /static/ {
        alias /app/staticfiles/;
    }

    # Proxy inverso: todo lo demás va a Django
    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Aquí irá 'location /api/v2/' apuntando al microservicio Flask
}